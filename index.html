        // --- จัดเรียงลำดับ Rank ---
        const rankOrder = { "LEADER": 1, "CO-LEADER": 2, "STAFF": 3, "MEMBER": 4 };
        members.sort((a, b) => (rankOrder[a.rank] || 99) - (rankOrder[b.rank] || 99));

        let currentRankFilter = 'ALL'; 

        function setFilter(rank, btnElement) {
            currentRankFilter = rank;
            
            const btns = document.querySelectorAll('.filter-btn');
            btns.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            applyFilters();
        }

        function applyFilters() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            
            const filteredMembers = members.filter(member => {
                const matchesSearch = member.name.toLowerCase().includes(input) || member.rank.toLowerCase().includes(input);
                const matchesRank = currentRankFilter === 'ALL' || member.rank === currentRankFilter;
                return matchesSearch && matchesRank;
            });

            renderMembers(filteredMembers);
        }

        function renderMembers(data) {
            const container = document.getElementById('memberListContainer');
            const emptyState = document.getElementById('emptyState');
            const countDisplay = document.getElementById('memberCountDisplay');
            
            container.innerHTML = ''; 
            countDisplay.innerText = `TOTAL MEMBERS: ${data.length}`;

            if (data.length === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
                data.forEach((member, index) => {
                    let rankClass = '';
                    if (member.rank === 'LEADER') rankClass = 'rank-leader';
                    else if (member.rank === 'CO-LEADER') rankClass = 'rank-coleader';
                    else if (member.rank === 'STAFF') rankClass = 'rank-staff';
                    else if (member.rank === 'MEMBER') rankClass = 'rank-member';

                    let imgSrc = member.img ? member.img : 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs='; 

                    const itemHTML = `
                        <div class="member-item" style="animation-delay: ${index * 0.03}s">
                            <div class="avatar">
                                <img src="${imgSrc}" alt="${member.name}" onerror="this.style.display='none'">
                            </div>
                            <div class="member-info">
                                <div class="member-name">${member.name}</div>
                                <div class="member-rank ${rankClass}">${member.rank}</div>
                            </div>
                            <a href="${member.fb}" target="_blank" class="fb-icon">f</a>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', itemHTML);
                });
            }
        }

        // --- 3. ระบบนาฬิกา ---
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toTimeString().split(' ')[0];
        }
        setInterval(updateClock, 1000);
        updateClock(); 

        // --- 4. ฟังก์ชันสลับหน้า ---
        function enterSystem() {
            const landing = document.getElementById('landing-page');
            const memberPage = document.getElementById('member-page');
            const bgLogo = document.getElementById('bg-logo');

            if (bgMusic.paused) { toggleMusic(); }

            landing.style.opacity = '0';
            landing.style.transform = 'scale(1.05)';
            
            setTimeout(() => {
                landing.classList.add('hidden');
                memberPage.classList.add('fade-in-active');
                bgLogo.style.fontSize = '12vw';
                bgLogo.style.opacity = '0.03';
                
                applyFilters(); 
            }, 600);
        }

        function backToHome() {
            const landing = document.getElementById('landing-page');
            const memberPage = document.getElementById('member-page');
            const bgLogo = document.getElementById('bg-logo');

            document.getElementById('searchInput').value = '';
            setFilter('ALL', document.querySelector('.filter-btn')); 

            memberPage.classList.remove('fade-in-active');
            landing.classList.remove('hidden');
            
            setTimeout(() => {
                landing.style.opacity = '1';
                landing.style.transform = 'scale(1)';
                
                bgLogo.style.fontSize = '20vw';
                bgLogo.style.opacity = '0.015';
            }, 50);
        }

        // --- 5. Particle System ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            for (let i = 0; i < 70; i++) particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        
        initParticles();
        animate();
    </script>
</body>
</html>
